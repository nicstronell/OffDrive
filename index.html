	<script>
		function recordPlaybackEvent(eventName) {
			if (!player) return;
			const audio = player.audio;
			try {
				const events = JSON.parse(localStorage.getItem('playbackEvents') || '[]');
				events.push({
					at: new Date().toISOString(),
					event: eventName,
					visibility: document.visibilityState,
					position: audio.currentTime,
					duration: Number.isFinite(audio.duration) ? audio.duration : null,
					trackSequence: player.trackSequence,
					mediaPlaybackState: navigator.mediaSession?.playbackState || null,
					stopAfterTrack: isPaused(),
					paused: audio.paused,
					ended: audio.ended,
					readyState: audio.readyState,
					networkState: audio.networkState,
					error: audio.error ? { code: audio.error.code, message: audio.error.message } : null
				});
				localStorage.setItem('playbackEvents', JSON.stringify(events.slice(-100)));
			} catch (error) {
				console.warn('Could not record playback event', error);
			}
		}

		function downloadPlaybackDiagnostics() {
			recordPlaybackEvent('diagnostics-download');
			const report = {
				version: document.getElementById('appVersion').textContent,
				browser: navigator.userAgent,
				events: JSON.parse(localStorage.getItem('playbackEvents') || '[]')
			};
			const url = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' }));
			const link = document.createElement('a');
			link.href = url;
			link.download = 'offdrive-playback-diagnostics.json';
			document.body.appendChild(link);
			link.click();
			link.remove();
			setTimeout(() => URL.revokeObjectURL(url), 60000);
		}

		['visibilitychange', 'freeze', 'resume'].forEach(eventName => {
			document.addEventListener(eventName, () => recordPlaybackEvent(eventName));
		});
		['pagehide', 'pageshow'].forEach(eventName => {
			window.addEventListener(eventName, () => recordPlaybackEvent(eventName));
		});

		function reloadLatestApp() {
			if (!confirm('Reload the latest app? This will stop playback.')) return;
			const url = new URL(window.location.href);
			url.searchParams.set('_appUpdate', Date.now().toString());
			window.location.replace(url.href);
		}

		function playIfNotPlaying()
		{
			saveLock=false;
			saveCall=0;
			dotColor='grey';
			window.onbeforeunload = null;
			if(player)
				setTimeout(() => {if(!player.isPlaying && !isPaused()) player.play();}, 4 * callDelay);
		}
		function nextIfNotPlaying()
		{
			saveLock=false;
			saveCall=0;
			dotColor='grey';
			window.onbeforeunload = null;
//			if(player)
//				setTimeout(() => {if(!player.isPlaying) playNextSong;}, 4 * callDelay);
		}
		
		function writeDebug(info){
			$('#debugInfo').html(
				$('#debugInfo').html() +
				'<pre onclick="$(this).hide()">' + info + '</pre>'
			);
		}
		
window.onerror = function (message, source, lineno, colno, error) {
    let details = '';

    if (error && error.stack) {
        details = error.stack;
    } else {
        details = message + ' at ' + source + ':' + lineno + ':' + colno;
    }

    writeDebug(details);

	nextIfNotPlaying();
};
window.addEventListener("unhandledrejection", function (event) {
    let details = '';
    writeDebug('event.reason' + event.reason + '\r\n'+ 'event.reason.stack' + event.reason.stack + '\r\n');

    if (event.reason && event.reason.stack) {
        details = event.reason.stack;
    } else {
        details = JSON.stringify(event.reason);
    }

    writeDebug('Unhandled Promise Rejection:\n' + details);
	
	nextIfNotPlaying();
});

	window.AudioContext = window.AudioContext || window.webkitAudioContext;
function registerMedia(song) {
    if ('mediaSession' in navigator) {
        const tags = getSongTags(song);
        navigator.mediaSession.metadata = new MediaMetadata({
            title: tags.title,
            artist: tags.artist,
			album: tags.album
        });

		const handlers = {
			play: () => { recordPlaybackEvent('media-action:play'); if (waitingForNextSong && !isPaused()) playNextSong(); else player.play(); },
			pause: () => { player.pauseAudio('media-session'); },
			nexttrack: () => { playNextSong(); },
			previoustrack: () => { makePlaylist(); }
		};
		Object.entries(handlers).forEach(([action, handler]) => {
			try {
				navigator.mediaSession.setActionHandler(action, handler);
			} catch (error) {
				console.warn('Unsupported media action:', action, error);
			}
		});
    }
}
	class Song {
	  constructor(id, mimeType, played, status, folderId) {
			this.m = mimeType; 						// mimetype
			this.p = played;   						// played count
			this.s = status;   						// status
			this.l = '';       						// location
			this.a = new Date().toISOString();		// date added
			this.i = id;       						// google file id
		  	this.d = null;     						// date last played
		  	this.f = folderId; 						// parent folder ID
		}
	}

	class SongTags{
	  constructor(title, artist, album, playedCount) {
			this.title = title;
			this.artist = artist;
			this.album = album;
			this.playedCount = playedCount;
		}
	}	

	class Player{
		constructor(audio){
//console.log('Player constructor: audio', audio);			
			this.audio = audio;
//console.log('Player constructor: this.audio', this.audio);			
			this.songID = '';
			this.trackSequence = 0;
			this.fileTags = new SongTags();
			this.treeTags = new SongTags();
			['loadstart', 'loadeddata', 'play', 'playing', 'pause', 'waiting', 'stalled', 'ended', 'error', 'emptied'].forEach(eventName => {
				this.audio.addEventListener(eventName, () => recordPlaybackEvent(eventName));
			});
			this.audio.onended = () => {
				this.playing = false;
				waitingForNextSong = true;
				if (!isPaused()) {
					playNextSong();
				} else {
					recordPlaybackEvent('stop-after-track');
					if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
				}
			};
//			this.audio.addEventListener("ended", () => {
// 				playTrack(getNextSong());
//			});
			this.audio.onplay = () => {
				saveCall++;
			};
			this.audio.onplaying = () => {
				if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
			};
			this.audio.onpause = () => {
				if (this.audio.ended) return;
				if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
			};
		}
		pauseAudio(reason) {
			recordPlaybackEvent('app-pause:' + reason);
			this.audio.pause();
		}
		play() {
			recordPlaybackEvent('app-play');
			const playback = this.audio.play();
			if (playback) playback.catch((error) => {
				recordPlaybackEvent('play-rejected:' + error.name);
				if (error.name === 'AbortError') return;
				$('#index_status').text('Playback stopped: ' + error.message + '. Tap Play to resume.');
			});
		}
		loadSong(song, onSuccess, onFailure) {
//console.log('loadSong: this.playing', this.playing);			
			if(!this.audio.playing){
				this.trackSequence++;
				this.songID = song.i;
//console.log('loadSong: song, this.songID', song, this.songID);			
//console.log('loadSong: trying to load', song);				
//console.log('loadSong: preLoads', preLoads);				
//console.log('loadSong: preLoads[this.songID]', preLoads[this.songID]);				
				if(typeof preLoads[this.songID] !== 'undefined' && preLoads[this.songID] !== loadingConst){
//console.log('loadSong: found as preload', song);				
					this.audio.src = preLoads[this.songID].url;
					registerMedia(song);
//console.log('loadSong: this.audio.src', this.audio.src);	
					this.afterLoadSong(onSuccess, song);
				} else {
            downloadDriveAudioUrl(this.songID, song.m)
                .then((audioUrl) => {
                    this.audio.src = audioUrl;

                    registerMedia(song);

                    // Keep the existing preload shape.
                    preLoads[this.songID] = {
                        url: audioUrl
                    };

                    // Preserve the existing tag-loading behaviour.
                    getFileTags(
                        this.songID,
                        setPreLoadTags
                    );

                    this.afterLoadSong(onSuccess, song);
                })
                .catch((err) => {
                    console.log(
                        '*** song load error',
                        err,
                        this.songID
                    );

                    deadSong(
                        this.songID,
                        err?.errors || [
                            {
                                message:
                                    err?.message ||
                                    String(err)
                            }
                        ],
                        true
                    );

                    this.kill();

                    if (onFailure) {
                        onFailure();
                    }
                });
				}
			}
		}
		afterLoadSong(onSuccess, song){
//console.log('afterLoadSong, about to play: isPaused()', isPaused());			
			waitingForNextSong = false;
			if(!isPaused()) this.play();
			if(song.s == '?') {
				song.s = '-';
			}
			localStorage.setItem('savedSongInfo', JSON.stringify(song));
			if(songList.length > 0) {
				setPlayingTags(this.Tags);
			} else {
				setPlayingTags(getSongTags(song));
			}
//console.log('afterLoadSong, getTagsFromTree');			
			getTagsFromTree([], song.i, song.i, (tags, songID) => { if(songID == song.i) this.treeTags = tags; });
//console.log('afterLoadSong, getFileTags');			
			getFileTags(song.i, (tags, songID) => { if(songID == song.i) this.fileTags = tags; });
//console.log('load song, before onSuccess');
			if(onSuccess)
				onSuccess();
			setTimeout(updatePlayingSongStats, 1024);
			removeFromPlaylist(this.songID);
			loadPreLoads(Date.now());
		}
		kill() {
			this.pauseAudio('unload');
			this.audio.src = null;
			this.songID = '';
			this.treeTags = new SongTags();
			this.fileTags = new SongTags();
		}
		get Song(){
//console.log('player Song: songID, Song', this.songID, getSongFromID(this.songID));			
			return getSongFromID(this.songID);
		}
		get Tags() {
//console.log('player Tags: Song', this.Song);			
			return getSongTags(this.Song);
		}
		get isPlaying() {
			return !this.audio.paused && 
			   !this.audio.ended && 
			   this.audio.currentTime > 0 && 
			   this.audio.readyState > 2;
		}
	}

//console.log('in playingSongStats, mods made, song = ', song);

	function deadSong(songID, error, playNext){
		try{
//console.log('in deadsong', songID, error, playNext);
			$('#index_status').html('failed to load file ' + songID + ' (error = '+error+')');
//console.log('dead song ' + songID + ' (error = '+error+')', getMemoryInfo());
			var deadSong=getSongFromID(songID);
			switch(deadSong.s)
			{
				case '':
				case '-':
					updateStatus('?', songID);
					break;
				case '?':
					updateStatus('D', songID);
					break;
			}
			removeFromPlaylist(songID);
			if(playNext)
				playNextSong();
		}
		catch(e){
//console.log('dead song ' + songID + ' could not prononce death (error = '+e+')');
		}
	}

	function getSongTags(song){
//console.log('getSongTags: song', song);		
		if(song?.l){
			var parts = song.l.split('\t');
			return new SongTags(parts.shift(), parts.pop(), parts.reverse().join('/'),song.p);
		}
		return new SongTags('unknown','unknown','unknown');
	}

	async function downloadDriveAudioUrl(fileId, mimeType) {
    if (!G_TOKEN) {
        throw new Error('No Google access token');
    }

    const response = await fetch(
        'https://www.googleapis.com/drive/v3/files/' +
        encodeURIComponent(fileId) +
        '?alt=media',
        {
            headers: {
                Authorization: `Bearer ${G_TOKEN}`
            }
        }
    );

    if (!response.ok) {
        throw new Error(`Drive download failed: ${response.status}`);
    }

    const blob = await response.blob();

    return URL.createObjectURL(
        blob.type
            ? blob
            : new Blob([blob], { type: mimeType || 'audio/mpeg' })
    );
}

	
	function removePreloadedSong(songID) {
    const item = preLoads[songID];

	if (item?.url && player && item.url === player.audio.src) {
		return;
	}

    if (item?.url?.startsWith('blob:')) {
        URL.revokeObjectURL(item.url);
    }

    delete preLoads[songID];
}

	function responseToObjectUrl(res, mimeType) {
    const body = res.body;

    // gapi normally returns binary data as a binary string.
    const bytes = new Uint8Array(body.length);

    for (let i = 0; i < body.length; i++) {
        bytes[i] = body.charCodeAt(i) & 0xff;
    }

    const blob = new Blob([bytes], {
        type: mimeType || 'audio/mpeg'
    });

    return URL.createObjectURL(blob);
}

	function preloadSong(songID, next, key) {
    console.log(
        'in preloadSong songID, key',
        songID,
        key
    );

    const song = getSongFromID(songID);

    Promise.resolve()
        .then(() => {
            if (!song) {
                throw new Error(
                    'Song not found: ' + songID
                );
            }

            return downloadDriveAudioUrl(
                songID,
                song.m
            );
        })
        .then((audioUrl) => {
            console.log(
                'in preloadSong response',
                songID
            );

            if (song.s === '?') {
                song.s = '-';
            }

            // Keep the existing .url property.
            preLoads[songID] = {
                url: audioUrl
            };

			if (waitingForNextSong && !isPaused()) {
				playNextSong();
			}

            console.log(
                'preloadSong: preLoads, count, playList.length',
                preLoads,
                Object.keys(preLoads).length,
                playList.length
            );

            refreshPlaylist();

            if (
                Object.keys(preLoads).length >=
                playList.length
            ) {
                saveCall++;
            }

            // Preserve existing metadata preloading.
            return getFileTags(
                songID,
                setPreLoadTags
            );
        })
        .catch((err) => {
            console.error(
                'song load error',
                songID,
                err
            );

            deadSong(
                songID,
                err?.errors || [
                    {
                        message:
                            err?.message ||
                            String(err)
                    }
                ],
                false
            );
        })
        .finally(() => {
            console.log(
                'preloadSong finally',
                key
            );

            if (next) {
                next(key);
            }
        });
}

	function makePlaylist(){
//console.log('makePlaylist: songList.length', songList.length);		
		if(songList.length>0){
			clearPreloads();
//console.log('just set loadingAPreload = false, finshed loading');						
			//loadingAPreload = false;
			if(playMode.hasClass('fa-calendar')){
				playList = songList
					.filter(function(i){ return i.s != 'D' && i.s != 'P' ; })
					.reverse()
					.sort(function(a,b){
//if(a.a.startsWith('2024-12'))
//console.log('sort 1: a, b, a.a > b.a, a.a < b.a', a.a, b.a, a.a > b.a, a.a < b.a);					
						if( a.a > b.a ) return -1;
						if( a.a < b.a ) return 1;
						return 0;
					})
					.sort(function(a,b){
						if( a.d < b.d ) return -1;
						if( a.d > b.d ) return 1;
						return 0;
					});
			}
			else if(playMode.hasClass('fa-calendar-day')){
				playList = songList
					.filter(function(i){ return i.s != 'D' && i.s != 'P' ; })
					.reverse()
					.sort(function(a,b){
//if(a.a.startsWith('2024-12'))
//console.log('sort 3: a, b, a.a > b.a, a.a < b.a', a.a, b.a, a.a > b.a, a.a < b.a);					
						if( a.a > b.a ) return -1;
						if( a.a < b.a ) return 1;
						return 0;
					});
			}
			else if(playMode.hasClass('fa-calendar-times')){
//console.log('minPlayed', minPlayed);				
				var candidates = songList.filter(function(s){ return s.s != 'D' && s.s != 'P' && s.p === minPlayed; });
				playList = [];
				var rando = parseInt(Date.now() % candidates.length);
//console.log('candidates.length = ', candidates.length);				
//console.log('candidates = ', candidates);				
//console.log('initial rando (' + Date.now() + ') = ', rando);	
				while(playList.length < 16 && playList.length != candidates.length ){
//console.log('playList.length = ', playList.length);							
					rando = rando % candidates.length;
//console.log('rando = ', rando);				
//console.log('making rando playlist', rando);					
//console.log('candidates[rando] = ', candidates[rando]);							
//console.log('playList.includes(candidates[rando]) = ', playList.includes(candidates[rando]));							
					if(playList.includes(candidates[rando])){
//console.log('making rando playlist **************** already exists', rando);					
						rando++;
					}
					else
					{
//console.log('making rando playlist adding to playlist', rando, candidates[rando]);					
						playList.push(candidates[rando]);
					}
					rando = Math.floor(Math.random() * rando * rando * 3.14159);
// console.log('rando, % candidates.length', rando, rando % candidates.length);				
				}
			}
//console.log('makePlaylist: playList.length', playList.length);		
//console.log('makePlaylist: playList', playList);		
			if(playList.length > playlistLength){
				playList = playList.slice(0, playlistLength);
			}
			playList = playList.reverse();
//console.log('makePlaylist: refreshPlaylist');		
			loadPreLoads(Date.now());
			refreshPlaylist();
		}
	}

	function scanFoldersPaged(folderID, pageToken){
		if(scanning.hasClass('fa-eye')){
			whenScanFolders(folderID, pageToken).then((res)=>{
//console.log('found ' + res.result.files.length + 'files in folder');
				if(res.result.files.length > 0){
					totalFolderCount += res.result.files.length;
//console.log('Adding ' + res.result.files.length + ' folders, ' + folders2Scan.length + '/' + totalFolderCount + ' ['+songList.length+']');
					for(var index=0; index < res.result.files.length; index++){
						var id = res.result.files[index].id;
						if(!folders2Scan[id])
						{
//console.log('Added folder ' + res.result.files[index].name + ' ('+id+') for checking');
							folders2Scan.push(id);
							setTimeout(scanFoldersPaged, callDelay * Math.abs(folders2Scan.length-4), id, null);
						}
					}
					if(res.result.nextPageToken !== undefined){
						setTimeout(scanFoldersPaged, callDelay, folderID, res.result.nextPageToken);
					}
					if(folderID == rootMusicDirID && !pageToken){
						setTimeout(scanFolderForFiles, callDelay * 8);
					}
				}
			}).catch((err)=>{
				$('#index_status').html('Retrying folder scan ' + folderID);
//console.log('Could not scan folder ' + folderID + ', will retry');
				setTimeout(scanFoldersPaged, callDelay * Math.abs(folders2Scan.length-4), folderID, pageToken);
			});
		}
	}

	function setSongLocation(tags, songID){
//console.log('in setSongLocation', tags, songID);
		if(tags){
			if(!tags.title)
				tags.title='unknown';
			if(!tags.artist)
				tags.artist='unknown';
			if(!tags.album)
				tags.album='unknown';
			if(tags.title === 'unknown' && tags.artist === 'unknown' && tags.album === 'unknown'){
				setMarquee('All tags are unknown for ' + songID);
			} else{
				var song = getSongFromID(songID);
				if(song){
					song.l = tags.title.toLowerCase()+'\t'+tags.album.toLowerCase()+'\t'+tags.artist.toLowerCase();
//console.log('in setSongLocation about to add 1 to ' + saveCall);
//					saveCall++;
				}
			}
//console.log('exiting setSongLocation', getSongFromID(songID));			
		}
	}

	function fillGap(index){
		var song = songList[index];
		var delay = 0;
		setMarquee('filling gaps for ' + index + ' (' + song?.l + ')');
//console.log('checking gap for ' + index + ' (' + song.l + ')');

		try{
			if(song.l === undefined || song.l === '' || song.l.indexOf('unknown') == 0){
//console.log('found gap w/out info at ' + index + ' setting info from tree ...');
				delay = delay + 3;
				getTagsFromTree([], song.i, song.i, setSongLocation);
			}
			
			if(song.a === undefined || song.a === null){
				delay = delay + 1;
//console.log('found gap at ' + index + ' setting created ...');
				whenGetInfo(song.i).then((res)=>{
					song.a = res.result.modifiedTime;
				});
			}
		}
		catch(e){
			setMarquee('error ' + e + ' filling gaps for ' + song.i + ' (' + index + ')');
//console.log('error ' + e + ' filling gaps for ' + song.i + ' (' + index + ')');
		}
		return delay;
	}
		
	function fillGaps(index){
		if(index < songList.length){
			var delay = fillGap(index);
			setTimeout(fillGaps, callDelay * delay, ++index);
		}
		else{
//console.log('in fillGaps about to add 1 to ' + saveCall + ' after fill gaps over');
			saveCall++;
		} 
	}

	function deleteFiles(fileSuffix, nextMethod){
//console.log('in deleteFiles before get files', fileSuffix);
		gapi.client.drive.files.list({
			q: '"'+rootMusicDirID+'" IN parents AND name = "'+musicIndexFileName+'.'+fileSuffix+'" AND trashed=false',
//			fields: 'id, name'
		}).then((lres)=>{
			if(lres.result.files.length === 0){
//console.log('nothing to delete, calling nextmethod');				
				nextMethod();
			}
			var fileCount = 0;
			for(var fileIndex=0; fileIndex<lres.result.files.length; fileIndex++){
//console.log('in deleteFiles', fileIndex, lres.result.files[fileIndex].id, lres.result.files[fileIndex].name);
				gapi.client.drive.files.delete({
					'fileId': lres.result.files[fileIndex].id
				}).then((dres)=>{
					setMarquee('Deleted '+fileSuffix+' file.');
//console.log('Deleted '+fileSuffix+' file.', fileIndex, fileCount);
					if(fileIndex == ++fileCount){
//console.log('*** triggering next t');
						setTimeout(nextMethod, callDelay * 4);
					}
				}).catch((derr)=>{
					setMarquee('Problem deleting '+fileSuffix+' file.');
//console.log('Problem deleting '+fileSuffix+' file.', derr);
					if(fileIndex == ++fileCount){
//console.log('*** triggering next e');
						setTimeout(nextMethod, callDelay * 4);
					}
				});
			}
		}).catch((lerr)=>{
//console.log('in deleteFiles, could not delete = ' + lerr);				
			setMarquee('could not delete '+fileSuffix+' files.');
			nextMethod();
		}); 
	}

	function makeCopies(tempId){
		try{
//console.log('in makeCopies, tempId = ' + tempId);
			deleteFiles(musicIndexFileNameSuffix, () => copyFile(tempId, musicIndexFileName+'.'+musicIndexFileNameSuffix));
 
			var now = new Date().getTime();
			if(localStorage.getItem('lastBackup') === null) {
				localStorage.setItem('lastBackup', 0);
			}
			var lastBackup = new Date(parseInt(localStorage.getItem('lastBackup'))).getTime();
//console.log('before special back up check',lastBackup, weekAsMilliseconds, (now - weekAsMilliseconds));			
			if(lastBackup < (now - dayAsMilliseconds)){
				localStorage.setItem('lastBackup', now);
				var dateAsString = new Date().getFullYear()+'-'+(new Date().getMonth()+1)+'-'+new Date().getDate();
console.log('backup up special with ' + dateAsString); 				
				deleteFiles(dateAsString, () => copyFile(tempId, musicIndexFileName+'.'+dateAsString));
			}
		} catch(e){
			localStorage.setItem('lastBackup', now);
		}

		dotColor='green';
		saveLock = false;
		window.onbeforeunload = null;

	function saveIndexBySuffix(suffix, callback){
//console.log('in saveIndexBySuffix before get access token');		
		var accessToken = gapi.auth.getToken().access_token;
		var indexContent = JSON.stringify(songList);
		var metadata = {
			'name': musicIndexFileName+'.'+suffix,
			'mimeType': 'text/json',
			'parents': [rootMusicDirID]
		};
		var form = new FormData();
		form.append('metadata', new Blob([JSON.stringify(metadata)], {type: 'application/json'}));
		form.append('file', indexContent);
		var xhr = new XMLHttpRequest();
//console.log('in saveIndexBySuffix before save index');		
		xhr.open('post', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id');
		xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
		xhr.responseType = 'json';
		xhr.onreadystatechange = () => {
//console.log('onreadystatechange xhr', xhr);			
console.log('onreadystatechange xhr.readyState', xhr.readyState);			
			if (xhr.readyState==4)
        	{
//console.log('onreadystatechange xhr.response', xhr.response);			
//console.log('onreadystatechange xhr.response.id', xhr.response.id);		
				setMarquee(suffix+' saved.');
				if(xhr.response?.id)
				{
					if(callback)
						callback(xhr.response.id);
//console.log('saveIndexBySuffix: suffix, xhr.response.id', suffix, xhr.response.id);				
					if(suffix == 'backup')
						musicIndexFileID = xhr.response.id;
				}
			}
		};
		xhr.send(form);		
	}

	function songSearch(clue){
		var songResults = $('#songResults');
		songResults.html('');
		var label = $('#songLabel'); 
		var playedCount =  parseInt($('#searchPlayedCount')[0].value);
//console.log('playedCount, cond', playedCount, playedCount >=0 ? s.p === playedCount : true);		
//console.log('songSearch: clue, playedCount', clue, playedCount);		
		//if(clue.length > 2){
			var foundSongs = [];
			clue = clue.toLowerCase();
			// whole phrase
			foundSongs = songList.filter(function(s){ return s.l.indexOf(clue) >= 0 && s.s !== 'D' && (playedCount >=0 ? s.p === playedCount : true)});
			var clues = clue.split(/\W+/g);
			// all clues
			if(foundSongs.length == 0){
				for(var clueIndex = 0; clueIndex < clues.length; clueIndex++){
					if(clueIndex === 0){
						foundSongs = songList.filter(function(s){ return s.l.indexOf(clues[clueIndex]) >= 0 && s.s !== 'D' && (playedCount >=0 ? s.p === playedCount : true)});
					}
					else{
						foundSongs = foundSongs.filter(function(s){ return s.l.indexOf(clues[clueIndex]) >= 0 && s.s !== 'D' && (playedCount >=0 ? s.p === playedCount : true)});
					}
				}
			}
			// any clues
			if(foundSongs.length == 0){
				for(var clueIndex = 0; clueIndex < clues.length; clueIndex++){
					foundSongs = foundSongs.concat(songList.filter(function(s){ return s.l.indexOf(clues[clueIndex]) >= 0 && s.s !== 'D' && (playedCount >=0 ? s.p === playedCount : true)}));
				}
			}
			if(foundSongs.length > 0){
				label.html('Found songs : ' + foundSongs.length + ' of ' + (songList.length - 1));
				songResults.html('<div><button type="button" class="btn btn-naked" style="padding:0px; margin-top:-4px" onclick="addAllToPlayList()"><span class="fas fa-plus"></span></button><span class="searchResult">Add All</span></div>');
				if(foundSongs.length > clue.length * 8){
					foundSongs = foundSongs.splice(0, clue.length * 8);
				}
				for(var index=0; index < foundSongs.length; index++){
					songResults.html(songResults.html()+searchResultLine(foundSongs[index].i, foundSongs[index].l));
				}
			}
		//}
	}

			if(saveCall > 0){

					if(saveCall > 8){

console.log('g saveCall', saveCall, 'dotColor', dotColor);

function getFileTags(songID, callback) {
    const preload = preLoads[songID];

    if (!preload || preload === loadingConst || !preload.url) {
        return Promise.resolve();
    }

    return fetch(preload.url)
        .then(res => res.arrayBuffer())
        .then(blob => {
            musicmetadata(blob, function(err, tags) {
                if (err || !tags) {
                    throw err || new Error('Could not read metadata');
                }

                callback(
                    new SongTags(
                        tags.title,
                        tags.artist?.[0],
                        tags.album
                    ),
                    songID
                );
            });
        })
        .catch(err => {
            console.warn('Could not read tags', songID, err);
        });
}

<script>
        // Network monitoring system
        const networkLog = [];
        let requestCounter = 0;

        // Intercept XMLHttpRequest (used by gapi)
        const originalXHROpen = XMLHttpRequest.prototype.open;
        const originalXHRSend = XMLHttpRequest.prototype.send;
        const originalXHRSetRequestHeader = XMLHttpRequest.prototype.setRequestHeader;

        XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
            this._gapiMonitor = {
                id: ++requestCounter,
                method: method,
                url: url,
                startTime: Date.now(),
                headers: {}
            };
            return originalXHROpen.apply(this, arguments);
        };

        XMLHttpRequest.prototype.setRequestHeader = function(header, value) {
            if (this._gapiMonitor) {
                this._gapiMonitor.headers[header] = value;
            }
            return originalXHRSetRequestHeader.apply(this, arguments);
        };

        XMLHttpRequest.prototype.send = function(data) {
            const monitor = this._gapiMonitor;
            
            if (monitor) {
                // Add to log immediately as pending
                const entry = {
                    id: monitor.id,
                    method: monitor.method,
                    url: monitor.url,
                    status: 'Pending',
                    startTime: monitor.startTime,
                    timestamp: new Date().toISOString(),
                    type: 'xhr',
                    pending: true
                };
                
                networkLog.push(entry);
                updateNetworkDisplay();

                // Track progress
                this.upload.addEventListener('progress', (e) => {
//console.log('upload progress event. e=',e);
                    if (e.lengthComputable) {
                        entry.uploadProgress = (e.loaded / e.total) * 100;
                    } else {
                        entry.downloadProgress = (e.loaded / 16384) * 100;
                        entry.loaded = e.loaded;
                        entry.total = 16384;
					}
                    updateNetworkDisplay();
                });

                this.addEventListener('progress', (e) => {
//console.log('progress event. e=',e);
                    if (e.lengthComputable) {
                        entry.downloadProgress = (e.loaded / e.total) * 100;
                        entry.loaded = e.loaded;
                        entry.total = e.total;
                    } else {
                        entry.downloadProgress = (e.loaded / 16384) * 100;
                        entry.loaded = e.loaded;
                        entry.total = 16384;
					}
                    updateNetworkDisplay();
                });

                // Track completion
                this.addEventListener('loadend', function() {
//console.log('loadend. this=', this);
                    entry.status = this.status;
                    entry.duration = Date.now() - monitor.startTime;
                    entry.pending = false;
                    entry.responseSize = this.response ? 
                        (typeof this.response === 'string' ? 
                            this.response.length : 
                            this.response.byteLength || this.response.size || 0) : 0;
                    
                    // Try to get content length from headers
                    const contentLength = this.getResponseHeader('content-length');
                    if (contentLength) {
                        entry.responseSize = parseInt(contentLength);
                    } else {
                        entry.responseSize = 16384;
					}
                    
                    updateNetworkDisplay();
                });

                this.addEventListener('error', function() {
                    entry.status = 'Error';
                    entry.duration = Date.now() - monitor.startTime;
                    entry.pending = false;
                    updateNetworkDisplay();
                });
            }

            return originalXHRSend.apply(this, arguments);
        };

        // Intercept fetch (backup method)
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
//console.log('in new fetch, args=', args);		
            const startTime = Date.now();
            const url = typeof args[0] === 'string' ? args[0] : args[0].url;
            const options = typeof args[0] === 'string' ? args[1] : args[0];
//console.log('in new fetch, options=', options);		
            const method = options?.method || 'GET';
            
            const entry = {
                id: ++requestCounter,
                method: method,
                url: url,
                status: 'Pending',
                startTime: startTime,
                timestamp: new Date().toISOString(),
                type: 'fetch',
                pending: true
            };
            
            networkLog.push(entry);
//console.log('in new fetch, added entry', entry);			
            updateNetworkDisplay();
            
            return originalFetch.apply(this, args)
                .then(async response => {
//console.log('in original fetch, entry', entry, networkLog, response);
                    entry.status = response.status;
                    entry.duration = Date.now() - startTime;
                    entry.pending = false;
                    
                    const contentLength = response.headers.get('content-length');
                    if (contentLength) {
                        entry.responseSize = parseInt(contentLength);
                    } else {
                        entry.responseSize = entry.url.length;
					}
                    
                    updateNetworkDisplay();
                    return response;
                })
                .catch(error => {
//console.log('in original fetch catch, error', error);
                    entry.status = 'Error';
                    entry.duration = Date.now() - startTime;
                    entry.pending = false;
                    entry.error = error.message;
                    updateNetworkDisplay();
                    throw error;
                });
        };

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '-';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        function formatUrl(url) {
            try {
                const urlObj = new URL(url);
                const path = urlObj.pathname + urlObj.search;
                return path.length > 32 ? path.substring(0,32) + '...' : path;
            } catch {
                return url.length > 32 ? url.substring(0,32) + '...' : url;
            }
        }

        function getStatusClass(status) {
            if (status === 'Pending') return 'pending';
            if (status === 'Error' || status >= 400) return 'error';
            return 'success';
        }

        function updateNetworkDisplay() {
            const logEl = document.getElementById('network-log');
             
            logEl.innerHTML = networkLog.map(entry => {
//console.log('in network update, entry', entry);	
                const statusText = entry.pending ? 'Pending' : entry.status;
                const progress = entry.downloadProgress || entry.uploadProgress || 0;
//console.log('progress='+progress);                
                var progressR = (255 - (parseInt(progress)*2)).toString(16);
				progressR = progressR.length === 1 ? '0' + progressR : progressR;
                var progressG = (parseInt(progress)*2).toString(16);
				progressG = progressG.length === 1 ? '0' + progressG : progressG;
//console.log('statusText', statusText);				
				if(statusText === 200){
//console.log('200 recognised');					
					progressR='00';
					progressG='FF';
				}
//console.log('progressR='+progressR+', progressG='+progressG);                
                return `
                    <tr style="background-color: #${progressR}${progressG}00;">
                        <td style="width: 1%; overflow: hidden;">${formatUrl(entry.url)}</td>
                        <td style="width: auto">${entry.method}</td>
                        <td style="width: auto">${statusText}</td>
                        <td style="width: auto">${entry.duration ? entry.duration + 'ms' : '-'}</td>
                        <td style="width: auto">${formatBytes(entry.responseSize || entry.total)}</td>
                    </tr>
                `;
            }).join('');
            
            // Auto-scroll to bottom
            logEl.scrollTop = logEl.scrollHeight;
        }
    </script>

			<button type="button" onclick="fillGaps(0);" class="btn btn-naked" style="float:left;"><span class="fas fa-fill" title="fill index gaps (from drive structure)"></span></button>			
			<button type="button" onclick="findIndex(); reloadFlag=true;" class="btn btn-naked" style="float:left;"><span class="fas fa-file-import" title="re-load index"></span></button>
			<button type="button" onclick="handleClientLoad();saveCall=3;saveLock=false;dotColor='white';saveIndexFile();" class="btn btn-naked" style="float:left;"><span class="fas fa-file-export" title="force save index"></span></button>
			<button type="button" onclick="document.querySelector('body').requestFullscreen();" class="btn btn-naked" style="float:left;"><span class="fas fa-expand" title="full screen"></span></button>
		</div>
		<button type="button" onclick="requestAccess();" class="btn btn-naked" id="sign-in-or-out-button" style="float:left"><span class="fas fa-sign-in-alt" style="font-size:128px" title="sign in"></span></button>
		<button type="button" onclick="google.accounts.oauth2.revoke(G_TOKEN)" class="btn btn-naked" id="revoke-access-button" style="float:left;display:none;"><span class="fas fa-person-booth" title="quit this nightmare"></span></button>
		<br />
		<br />
		</div>
		<div id="config" style="overflow-x: hidden; display:none; width: auto;">
			<button type="button" class="btn btn-outline-info" onclick="toggleScan()" id="scanning">
				<span class="fas fa-low-vision" title="scan for new files on drive"></span>
			</button>
			<button type="button" class="btn btn-outline-info" onclick="createSonglistStats()">
				<span class="fas fa-chart-bar"></span>
			</button>
			<button type="button" class="btn btn-outline-info" onclick="createCategorisedSongList()">
				<span class="fas fa-align-left"></span>
			</button>
			<button type="button" id="checkFilesExist" style="display:none" class="btn btn-outline-info" onclick="checkFilesExist(0)">
				<span class="fas fa-medkit" title="check file exists"></span>
			</button>

			<div id="songlistStats">
			</div>
			<div id="categorisedSongs">
			</div>
		</div>
		<footer style="clear:both; padding:8px; font-size:small; text-align:left; max-width:100vw; box-sizing:border-box; overflow-wrap:anywhere;">
			Last updated: <time datetime="2026-10-22">22 Oct 2026</time> (<span id="appVersion">v2026.10.22.5</span>)
			<button type="button" class="btn btn-naked" onclick="reloadLatestApp()" title="Reload latest app (stops playback)" aria-label="Reload latest app (stops playback)">
				<span class="fas fa-sync-alt" aria-hidden="true"></span>
			</button>
			<button type="button" class="btn btn-naked" onclick="downloadPlaybackDiagnostics()" title="Download playback diagnostics" aria-label="Download playback diagnostics">
				<span class="fas fa-file-download" aria-hidden="true"></span>
			</button>
		</footer>
	</body>
